<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김효석 | 설득강사</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;
  background:linear-gradient(145deg,#081b33,#164b73);
  color:#fff;min-height:100vh;padding:20px 15px;
}
.card{
  max-width:440px;margin:auto;padding:42px 24px 28px;
  border-radius:30px;background:rgba(255,255,255,.09);
  box-shadow:0 20px 50px rgba(0,0,0,.3);
  backdrop-filter:blur(12px);
}
.top{text-align:center;margin-bottom:38px}
.badge{
  display:inline-block;background:#f4c542;color:#10263f;
  padding:8px 17px;border-radius:30px;font-size:15px;
  font-weight:800;margin-bottom:18px;
}
h1{font-size:46px;letter-spacing:-3px;margin-bottom:10px}
.intro{font-size:21px;line-height:1.55;font-weight:600}
.services{margin-bottom:35px}
.services h2,.calculator h2{
  text-align:center;font-size:20px;margin-bottom:18px;color:#dcecff;
}
.service{
  display:flex;align-items:center;gap:15px;background:#fff;
  color:#10263f;border-radius:18px;padding:19px 17px;
  margin-bottom:13px;font-size:20px;font-weight:800;
  box-shadow:0 8px 20px rgba(0,0,0,.18);
}
.num{
  width:43px;height:43px;min-width:43px;border-radius:50%;
  display:grid;place-items:center;background:#164b73;
  color:#fff;font-size:18px;
}
.contact{
  display:block;text-align:center;text-decoration:none;
  background:#f4c542;color:#10263f;padding:19px;
  border-radius:17px;font-size:22px;font-weight:900;
}
.phone{display:block;font-size:16px;margin-top:5px}
.calculator{
  margin-top:28px;padding:23px 18px;border-radius:22px;
  background:rgba(255,255,255,.1);
}
.input-group{margin-bottom:14px}
.input-group label{
  display:block;font-size:15px;font-weight:700;
  margin-bottom:7px;color:#dcecff;
}
.input-group input{
  width:100%;padding:15px;border:0;border-radius:12px;
  font-size:18px;outline:none;background:#fff;color:#10263f;
}
.calc-btn{
  width:100%;border:0;border-radius:13px;padding:16px;
  background:#fff;color:#164b73;font-size:18px;
  font-weight:900;cursor:pointer;margin-top:4px;
}
.result{
  margin-top:17px;padding:17px;border-radius:13px;
  background:#f4c542;color:#10263f;text-align:center;
  font-size:17px;font-weight:800;
}
.result strong{display:block;font-size:28px;margin-top:5px}
.copy{text-align:center;font-size:13px;color:#c5d7e8;margin-top:20px}
</style>
</head>
<body>

<main class="card">

  <section class="top">
    <div class="badge">설득강사</div>
    <h1>김효석</h1>
    <p class="intro">말에 힘을 더하고<br>설득에 스토리를 더합니다.</p>
  </section>

  <section class="services">
    <h2>강의 분야</h2>
    <div class="service"><span class="num">1</span><span>기업체 강의</span></div>
    <div class="service"><span class="num">2</span><span>영업인 강의</span></div>
    <div class="service"><span class="num">3</span><span>AI강의 강사</span></div>
  </section>

  <a class="contact" href="tel:01012341234">
    📞 문의하기
    <span class="phone">010-1234-1234</span>
  </a>

  <section class="calculator">
    <h2>💰 모임 회비 나누기</h2>

    <div class="input-group">
      <label for="total">총 금액</label>
      <input id="total" type="number" inputmode="numeric" placeholder="예: 500000">
    </div>

    <div class="input-group">
      <label for="people">인원</label>
      <input id="people" type="number" inputmode="numeric" placeholder="예: 8">
    </div>

    <button class="calc-btn" onclick="calculate()">1인당 금액 계산하기</button>

    <div class="result" id="result">
      총 금액과 인원을 입력해주세요.
    </div>
  </section>

  <p class="copy">© 김효석아카데미</p>
</main>

<script>
function calculate(){
  const total=Number(document.getElementById("total").value);
  const people=Number(document.getElementById("people").value);
  const result=document.getElementById("result");

  if(total<=0||people<=0){
    result.innerHTML="총 금액과 인원을 올바르게 입력해주세요.";
    return;
  }

  const perPerson=Math.round(total/people);
  result.innerHTML=
    "1인당 부담 금액<strong>"+perPerson.toLocaleString()+"원</strong>";
}

document.getElementById("total").addEventListener("input",calculate);
document.getElementById("people").addEventListener("input",calculate);
</script>

</body>
</html>
